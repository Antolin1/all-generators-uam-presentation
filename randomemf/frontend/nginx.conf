server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolving at request time lets nginx start (and survive backend restarts)
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8081;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }

    # the page itself is never cached, so a rebuilt interface shows up on the next reload instead of a stale one
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
