<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M2 Playground</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23862e9c'/%3E%3Ccircle cx='9' cy='16' r='3.2' fill='white'/%3E%3Ccircle cx='20' cy='8' r='3.2' fill='white'/%3E%3Ccircle cx='23' cy='23' r='3.2' fill='white'/%3E%3Cpath d='M9 16L20 8M9 16L23 23' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>M2 · Model Mime</h1>
          <span class="tagline">Generador entrenado · Playground</span>
        </div>
      </div>

      <label class="field">
        <span>Modelo</span>
        <select id="model"></select>
      </label>

      <label class="field" title="Número máximo de objetos del modelo generado">
        <span>Tamaño máx.</span>
        <input id="max-size" type="number" min="2" max="500" step="1" />
      </label>

      <div class="field seed">
        <span>Semilla</span>
        <div class="seed-row">
          <input id="seed" type="number" step="1" min="0" title="Semilla del muestreo" />
          <button id="seed-lock" class="icon-btn" type="button" aria-pressed="false"></button>
        </div>
      </div>

      <div class="spacer"></div>

      <span id="backend-status" class="pill" data-state="connecting">Conectando…</span>
      <button id="generate" class="primary" type="button" title="Generar un modelo (Ctrl+Enter)">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
        Generate
      </button>
    </header>

    <main id="workspace">
      <section class="panel config-panel" aria-label="Entrenamiento y modelos">
        <div class="panel-head tabs" role="tablist">
          <button role="tab" data-side="train" aria-selected="true">Entrenar</button>
          <button role="tab" data-side="models" aria-selected="false">Modelos <span id="model-count" class="count-badge"></span></button>
        </div>

        <div id="side-train" class="config-body">
          <h3 class="section">Dataset</h3>
          <select id="t-dataset" class="wide"></select>
          <p id="t-dataset-info" class="hint-text"></p>

          <h3 class="section">Hiperparámetros</h3>
          <div class="params-grid">
            <label class="span2" title="Nombre con el que aparecerá el modelo">Nombre del modelo<input id="t-name" type="text" maxlength="60" /></label>
            <label title="Pasadas completas sobre los datos de entrenamiento">Épocas<input id="t-epochs" type="number" min="1" max="300" step="1" /></label>
            <label title="Iteraciones de la descomposición Monte Carlo: cada modelo del dataset se descompone k veces en una secuencia de operaciones de edición. Es la parte más lenta y trabaja en CPU.">k (Monte Carlo)<input id="t-k" type="number" min="1" max="30" step="1" /></label>
            <label title="Tamaño de las representaciones de la red neuronal">Dimensión oculta<input id="t-hidden" type="number" min="8" max="512" step="8" /></label>
            <label title="Tasa de aprendizaje de Adam">Tasa de aprendizaje<input id="t-lr" type="number" min="0.00001" max="0.5" step="any" /></label>
            <label title="Ejemplos por lote">Tamaño de lote<input id="t-batch" type="number" min="8" max="2048" step="8" /></label>
            <label title="Épocas sin mejorar la pérdida antes de parar">Paciencia<input id="t-patience" type="number" min="1" max="100" step="1" /></label>
            <label title="Semilla del entrenamiento">Semilla<input id="t-seed" type="number" min="0" step="1" /></label>
          </div>
          <div class="checks">
            <label class="check" id="t-complex-label" title="Además de añadir un objeto cada vez, la red puede aplicar operaciones compuestas del dominio (p. ej. «añadir región con estado inicial»). Solo existen para Yakindu y Ecore."><input id="t-complex" type="checkbox" /> Operaciones de edición complejas</label>
          </div>
          <p id="t-estimate" class="hint-text"></p>
          <div class="train-actions">
            <button id="t-start" class="primary" type="button">Entrenar</button>
            <button id="t-cancel" class="ghost" type="button" hidden>Cancelar</button>
          </div>

          <div id="job" class="job" hidden></div>
        </div>

        <div id="side-models" class="config-body" hidden>
          <ul id="model-list" class="model-list"></ul>
        </div>
      </section>

      <div class="splitter v" id="split-v" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <div class="right">
        <section class="panel graph-panel" aria-label="Modelo generado">
          <div class="panel-head">
            <h2>Modelo generado</h2>
            <span id="graph-model" class="muted ellipsis"></span>
            <div class="spacer"></div>
            <div class="seg" role="group" aria-label="Orientación">
              <button id="dir-down" type="button" data-dir="DOWN" title="Árbol de arriba abajo">↓</button>
              <button id="dir-right" type="button" data-dir="RIGHT" title="Árbol de izquierda a derecha">→</button>
            </div>
            <button id="fit" class="ghost" type="button" title="Ajustar a la vista">Ajustar</button>
          </div>
          <div id="stepper" class="stepper" hidden>
            <button id="step-play" class="icon-btn" type="button" title="Reproducir la generación paso a paso">▶</button>
            <input id="step-range" type="range" min="0" max="0" step="1" value="0" aria-label="Paso de la generación" />
            <span id="step-label" class="step-label"></span>
          </div>
          <div id="graph" class="graph"></div>
          <div class="graph-foot">
            <span><svg width="34" height="10"><use href="#legend-containment" /></svg> contención</span>
            <span><svg width="34" height="10"><use href="#legend-reference" /></svg> referencia</span>
            <span class="hint">rueda: zoom · arrastrar: mover · clic: seleccionar</span>
            <div class="spacer"></div>
            <span id="graph-stats"></span>
          </div>
        </section>

        <div class="splitter h" id="split-h" role="separator" aria-orientation="horizontal" tabindex="0"></div>

        <section class="panel rules-panel" aria-label="Resultado">
          <div class="panel-head tabs" role="tablist">
            <button role="tab" data-tab="steps" aria-selected="true">Operaciones aplicadas</button>
            <button role="tab" data-tab="summary" aria-selected="false">Resumen</button>
            <button role="tab" data-tab="xmi" aria-selected="false">XMI</button>
            <div class="spacer"></div>
            <button id="download" class="ghost" type="button" hidden>Descargar XMI</button>
          </div>
          <div id="tab-steps" class="tab-body" role="tabpanel"></div>
          <div id="tab-summary" class="tab-body" role="tabpanel" hidden></div>
          <div id="tab-xmi" class="tab-body" role="tabpanel" hidden></div>
        </section>
      </div>
    </main>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="legend-containment"><line x1="8" y1="5" x2="34" y2="5" stroke="var(--edge)" stroke-width="1.6" /><path d="M0 5 L4 2 L8 5 L4 8 Z" fill="var(--edge)" /></g>
        <g id="legend-reference"><line x1="0" y1="5" x2="27" y2="5" stroke="var(--ref)" stroke-width="1.6" stroke-dasharray="4 3" /><path d="M34 5 L27 1.8 L27 8.2 Z" fill="var(--ref)" /></g>
      </defs>
    </svg>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
